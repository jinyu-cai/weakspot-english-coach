# Local PostgreSQL for development and integration tests.
#
#   docker compose -f docker-compose.local.yml up -d postgres
#   uv run alembic upgrade head
#
# Development data persists in the named volume. The dedicated weakspot_test
# database is safe for test reset helpers and must never point at production.
services:
  postgres:
    image: postgres:16-alpine
    container_name: weakspot-postgres-local
    environment:
      POSTGRES_USER: weakspot
      POSTGRES_PASSWORD: weakspot
      POSTGRES_DB: weakspot
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weakspot -d weakspot"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - weakspot-postgres-data:/var/lib/postgresql/data
      - ./deploy/init-local.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro

volumes:
  weakspot-postgres-data:
