services:
  postgres:
    image: postgres:16-alpine
    container_name: weakspot-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in apps/api/.env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in apps/api/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in apps/api/.env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - weakspot-postgres-data:/var/lib/postgresql/data
    stop_grace_period: 1m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build: .
    container_name: weakspot-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Bind to localhost only — Nginx (same host) proxies to it; not public.
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  # An explicit name keeps production data separate from the local-development
  # Compose volume. Never use `docker compose down -v` in production.
  weakspot-postgres-data:
    name: weakspot-postgres-data
