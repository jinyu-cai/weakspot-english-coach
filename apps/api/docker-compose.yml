services:
  api:
    build: .
    container_name: weakspot-api
    restart: always
    ports:
      # Bind to localhost only — Nginx (same host) proxies to it; not public.
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      # Download AWS's global RDS CA bundle to this path before production
      # deployment. PostgreSQL uses it for sslmode=verify-full.
      - ./deploy/certs/global-bundle.pem:/run/secrets/rds-ca-bundle.pem:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
